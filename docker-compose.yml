services:
  murktelegot:
    # Versão fixa para atualizações controladas; imagem somente AMD64.
    image: ghcr.io/rodrigomescua/murktelegot:0.5.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_USER: "admin"
      APP_PASSWORD: "SUBSTITUA-POR-UMA-SENHA-ALEATORIA-LONGA"
      APP_PUBLIC_URL: ""
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      DATA_DIR: "/data"
    volumes:
      - murktelegot_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  murktelegot_data:
