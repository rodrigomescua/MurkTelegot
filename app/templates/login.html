<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · MurkTelegot</title><meta name="theme-color" content="#0E1621"><link rel="icon" type="image/svg+xml" href="/brand/logo-icon.svg"><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="login-page"><section class="login-card"><img class="login-logo" src="/brand/logo.svg" alt="MurkTelegot"><h1>Entre no seu painel.</h1><p>Use o usuário e a senha configurados para o MurkTelegot.</p>{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="username">Usuário</label><input id="username" name="username" value="{{ username|default('') }}" autocomplete="username" required maxlength="256" autofocus><label for="panel-password">Senha</label><input id="panel-password" name="panel_password" type="password" autocomplete="current-password" required maxlength="256"><button>Entrar</button></form></section></main></body></html>
